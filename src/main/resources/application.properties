spring.application.name=tcc-backend

server.port=${PORT:8080}

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console


api.security.token.secret=${JWT_SECRET}

# Configuração do PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Configurações do JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Origens exatas autorizadas no navegador; Android usa o mesmo JWT sem depender de CORS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://neuro-help-psi.vercel.app,http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
