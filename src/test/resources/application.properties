spring.application.name=tcc-backend-test

# Configuração do banco em memória H2 para testes
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Segredo de testes para o JWT
api.security.token.secret=segredo-apenas-para-testes-nao-usar-em-producao
spring.h2.console.enabled=false
app.cors.allowed-origins=https://neuro-help-psi.vercel.app,http://localhost:5500
